[project]
name = "cnn-lstm-reg"
version = "0.1.0"
description = "CNN-LSTM regression"
readme = "README.md"
authors = [
    { name = "Oguzb" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "obspy>=1.5.1",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.15.0",
]

[project.scripts]
cnn-lstm-reg = "cnn_lstm_reg:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
